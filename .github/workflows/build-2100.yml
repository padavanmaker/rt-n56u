name: Padavan MI-R3P02

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses-dev libltdl-dev wget

      - name: Clone source to /opt/rt-n56u
        run: |
          sudo git clone --depth=1 https://github.com/chongshengB/rt-n56u.git /opt/rt-n56u

      - name: Download toolchain
        run: |
          cd /opt/rt-n56u/toolchain-mipsel
          sudo sh dl_toolchain.sh
          sudo mkdir -p /opt/rt-n56u/toolchain-mipsel/tmp
          test -d toolchain-3.4.x || { echo "toolchain download failed"; exit 1; }
          ls toolchain-3.4.x/bin/ | head -5

      - name: Fix dead go mirror
        run: |
          sudo sed -i 's|https://gomirrors.org/dl/go|https://dl.google.com/go|' /opt/rt-n56u/trunk/tools/Makefile
          grep -n "dl.google.com" /opt/rt-n56u/trunk/tools/Makefile

      - name: Build firmware
        run: |
          cd /opt/rt-n56u/trunk
          sudo ./clear_tree_simple
          sudo ./build_firmware_modify MI-R3P
          ls -lh images/ || true
          sudo mv -f images/*.trx $GITHUB_WORKSPACE/
          sudo chmod 644 $GITHUB_WORKSPACE/*.trx
          echo "=== FIRMWARE READY ==="
          ls -lh $GITHUB_WORKSPACE/*.trx

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: padavan-MI-R3P
          path: ${{ github.workspace }}/*.trx
          if-no-files-found: error
          retention-days: 14
          ls -lh $GITHUB_WORKSPACE/*.trx

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: padavan-MI-R3P
          path: ${{ github.workspace }}/*.trx
          if-no-files-found: error
          retention-days: 14
          
